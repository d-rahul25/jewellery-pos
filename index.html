<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a4f00">
<title>Jewellery POS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="rates" id="rateStrip"></div>
  <div class="feed" id="feedStatus"><span class="dot"></span><span id="feedText">Connecting…</span></div>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="price" class="on">Price</button>
  <button data-tab="list">List <span id="listCount" class="badge" hidden></span></button>
  <button data-tab="rates">Rates</button>
  <button data-tab="settings">Settings</button>
</nav>

<div class="sheet-bg" id="sheetBg" hidden></div>
<section class="sheet" id="sheet" hidden></section>
<div class="toast" id="toast" hidden></div>

<script src="lib/socket.io.min.js"></script>
<script src="lib/pako_inflate.min.js"></script>
<script src="app.js"></script>
</body>
</html>
